[project]
name = "fast-injection-detector"
version = "0.1.0"
description = "Prompt injection detector (DeBERTa-v3) optimized for CPU with ONNX and int8 quantization, with speed/accuracy benchmarks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "datasets>=5.0.1,<5.1",
  "optimum[onnxruntime]>=2.1.0",
  "scikit-learn>=1.9.1",
  "torch>=2.11.0",
  "transformers>=4.57.6",
]

[tool.uv.sources]
torch = [
  { index = "pytorch-cpu", marker = "sys_platform == 'win32' or sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
